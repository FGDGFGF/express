name: Update lexpress feed

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails (and GitHub emails you) if no articles are found or the fetch fails
      - name: Build feed
        run: python scrape.py

      - name: Commit feed if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/lexpress.xml
          git diff --cached --quiet || (git commit -m "Update feed" && git push)
